<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#8140d0" />
    <meta name="description" content="Танцевальная игра через веб-камеру: повторяй движения за тренером, а игра подскажет, что исправить." />
    <title>Motion Dance: танцуй перед камерой</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,600;0,800;0,900;1,900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <canvas id="scene" aria-label="Сцена с танцором" data-i18n-aria="scene.aria"></canvas>

    <header class="hud" id="hud" hidden>
      <div class="score-chip">
        <span class="score-label" data-i18n="hud.score">Очки</span>
        <strong id="hud-score">0</strong>
        <span class="combo" id="hud-combo" hidden></span>
      </div>
      <div class="gauge" aria-label="Звёзды" data-i18n-aria="hud.stars">
        <div class="gauge-track"><i id="hud-star-bar"></i></div>
        <div class="gauge-stars" id="hud-stars"></div>
      </div>
    </header>

    <div class="verdict" id="verdict" hidden></div>

    <div class="pictos" id="pictos" hidden aria-hidden="true">
      <div class="pictos-now"></div>
      <div class="pictos-track" id="pictos-track"></div>
    </div>

    <aside class="pip" id="pip" hidden>
      <canvas id="pose"></canvas>
      <span class="pip-label" data-i18n="pip.label">Так тебя видит камера</span>
    </aside>

    <div class="banner" id="banner" hidden role="status" aria-live="polite">
      <span class="banner-cue" id="banner-cue" aria-hidden="true"></span>
      <span class="banner-label" id="banner-label"></span>
      <span class="banner-text" id="banner-text"></span>
      <span class="banner-meter" id="banner-meter"><i></i></span>
    </div>

    <main id="screens"></main>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
