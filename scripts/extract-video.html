<!doctype html>
<!-- Used by scripts/extract-video-dance.mjs: finds the dancer's pose in every frame, and the music's beat. -->
<meta charset="utf-8" />
<script type="module">
  import { FilesetResolver, PoseLandmarker } from '@mediapipe/tasks-vision';
  import { features } from '/src/pose/features.ts';
  import { detectBeat } from '/src/audio/beat.ts';

  const deg = (r) => (r * 180) / Math.PI;

  /**
   * Measures the dancer exactly as the game measures a player (src/pose/features.ts), then mirrors it:
   * she faces the camera, so the arm on screen-left, which the player copies with their own left arm,
   * is her right arm, and leaning to her right is the player's lean to their left.
   */
  function measure(pose, aspect) {
    const f = features(pose, aspect);
    if (!f.present) return null;
    const arm = (a) => ({ ok: a.ok, dir: deg(Math.atan2(a.out, -a.raise)), elbow: a.elbow, reach: Math.hypot(a.raise, a.out) / 1.6 });
    return { L: arm(f.arms.R), R: arm(f.arms.L), tilt: -f.tilt, midY: f.midY, sw: f.sw, vis: f.vis };
  }

  window.run = async (frames, fps, aspect) => {
    const vision = await FilesetResolver.forVisionTasks('/node_modules/@mediapipe/tasks-vision/wasm');
    const landmarker = await PoseLandmarker.createFromOptions(vision, {
      baseOptions: { modelAssetPath: '/model/pose.task', delegate: 'CPU' },
      runningMode: 'VIDEO',
      numPoses: 1,
    });
    const out = [];
    for (let i = 0; i < frames; i++) {
      const image = await createImageBitmap(await (await fetch(`/frames/${i}`)).blob());
      const r = landmarker.detectForVideo(image, Math.round((i * 1000) / fps));
      image.close();
      out.push(r.landmarks[0] ? measure(r.landmarks[0], aspect) : null);
    }
    const audio = await new OfflineAudioContext(1, 1, 22050).decodeAudioData(await (await fetch('/audio')).arrayBuffer());
    return { frames: out, beat: detectBeat(audio.getChannelData(0), audio.sampleRate) };
  };
  window.ready = true;
</script>
