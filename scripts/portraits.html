<!doctype html>
<!-- Used by scripts/import-avatars.mjs: draws each character's head and shoulders for the shop. -->
<meta charset="utf-8" />
<canvas id="c" width="192" height="192"></canvas>
<script type="module">
  import { Box3, DirectionalLight, HemisphereLight, PerspectiveCamera, Scene, SRGBColorSpace, Vector3, WebGLRenderer } from 'three';
  import { RealCoach } from '/src/stage/realCoach.ts';

  const renderer = new WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.outputColorSpace = SRGBColorSpace;
  renderer.setClearColor(0x000000, 0);

  /** A head-and-shoulders picture, framed on the top third of the dancer, as a PNG data URL. */
  window.portrait = async (url) => {
    const scene = new Scene();
    scene.add(new HemisphereLight(0xffffff, 0xb9a2ff, 2.2));
    const key = new DirectionalLight(0xffffff, 2.4);
    key.position.set(1.5, 3, 4);
    scene.add(key);
    const dancer = await RealCoach.load(url);
    // A few frames of the idle groove relax the arms out of the T-pose.
    for (let i = 0; i < 60; i++) dancer.update(null, 0, 0, 1 / 30);
    scene.add(dancer.group);
    dancer.group.updateMatrixWorld(true);
    const box = new Box3().setFromObject(dancer.group);
    // Frame from the neck to the top of the hair: chibi characters have far bigger heads than Michelle.
    let neck = null;
    dancer.group.traverse((o) => { if (!neck && o.isBone && /(^|:)Head$/.test(o.name.replace('mixamorig', ''))) neck = o; });
    const headY = neck ? neck.getWorldPosition(new Vector3()).y : box.max.y - (box.max.y - box.min.y) * 0.2;
    const top = box.max.y;
    const span = (top - headY) * 1.9 + 0.12;
    const centre = new Vector3(0, headY + (top - headY) * 0.42, 0);
    const camera = new PerspectiveCamera(30, 1, 0.05, 50);
    camera.position.set(0, centre.y + 0.03, span / 2 / Math.tan((15 * Math.PI) / 180) + 0.2);
    camera.lookAt(centre);
    renderer.render(scene, camera);
    return renderer.domElement.toDataURL('image/png');
  };
  window.ready = true;
</script>
