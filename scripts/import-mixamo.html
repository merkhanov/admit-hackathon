<!doctype html>
<!-- Used by scripts/import-mixamo.mjs: turns a Mixamo FBX into a small GLB inside the browser. -->
<meta charset="utf-8" />
<script type="module">
  import { MeshStandardMaterial } from 'three';
  import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
  import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

  /** Standard materials export cleanly to glTF; Mixamo's FBX files come with Phong ones. */
  function toStandard(m) {
    // A texture the FBX only references (not embedded) has no pixels: leave it out.
    const usable = (t) => (t && t.image && t.image.width > 0 ? t : null);
    const out = new MeshStandardMaterial({
      name: m.name,
      color: m.color,
      map: usable(m.map),
      normalMap: usable(m.normalMap),
      transparent: m.transparent,
      opacity: m.opacity,
      alphaTest: m.transparent ? 0.5 : 0,
      roughness: 0.75,
      metalness: 0,
    });
    // Textures with an alpha channel (hair cards, lashes) stay PNG; the rest become JPEG.
    for (const t of [out.map, out.normalMap]) if (t) t.userData.mimeType = m.transparent && t === out.map ? 'image/png' : 'image/jpeg';
    if (m.transparent) out.depthWrite = false;
    return out;
  }

  window.convert = async (url) => {
    const model = await new FBXLoader().loadAsync(url);
    model.animations = [];
    model.traverse((o) => {
      if (o.isMesh) o.material = Array.isArray(o.material) ? o.material.map(toStandard) : toStandard(o.material);
    });
    const glb = await new GLTFExporter().parseAsync(model, { binary: true, maxTextureSize: 1024, onlyVisible: true });
    const bytes = new Uint8Array(glb);
    let text = '';
    for (let i = 0; i < bytes.length; i += 0x8000) text += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
    return btoa(text);
  };
  window.ready = true;
</script>
